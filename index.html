<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENG. A7MED 3LLAM ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 60% 45%,#302c43,#171621 55%,#090910);font-family:Consolas,monospace;color:white}
.scene{display:flex;align-items:center;justify-content:center;gap:65px;padding:25px;width:100%}
.window{width:340px;min-height:230px;padding:18px;border:1px solid #ff668544;border-radius:12px;background:#11111be8;box-shadow:0 0 35px #ff174422;animation:appear 1.5s ease both}
.topbar{display:flex;align-items:center;gap:7px;padding-bottom:13px;border-bottom:1px solid #ffffff17;color:#a9a5bc;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.heading{margin:18px 0 12px;color:#ff668c;font-size:14px}
.message{min-height:95px;color:#f7e8f0;font-size:15px;line-height:2;overflow-wrap:anywhere}
.prompt{color:#ff729d}.cursor{display:inline-block;width:7px;height:15px;margin-left:3px;vertical-align:middle;background:#ff6488;animation:blink .7s infinite}
.hint{margin-top:12px;color:#858197;font-size:11px}
.heart-area{width:280px;text-align:center}
.heart-button{display:block;padding:0;margin:auto;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.heart-button:focus-visible{outline:2px solid #ff7899;border-radius:20px}
svg{width:260px;overflow:visible;filter:drop-shadow(0 0 10px #ff244b55)}
.heart-outline{fill:none;stroke:#ff536f;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawHeart 2.2s ease forwards}
.heart-fill{fill:url(#heartGradient);opacity:0;animation:fillHeart 1.5s ease forwards;animation-delay:2s}
.heart-photo{opacity:0;transition:opacity .35s ease;pointer-events:none;overflow:hidden}
.photo-tools{margin-top:12px}
#choosePhotos{color:white;background:#30243a;border:1px solid #ff547d88;border-radius:20px;padding:9px 12px;cursor:pointer;font-size:11px}
#photoInput{display:none}
.decoration{fill:none;stroke:#ff6c88;stroke-width:2;stroke-linecap:round;stroke-dasharray:170;stroke-dashoffset:170;animation:drawDecoration 1.5s ease forwards;animation-delay:1s}
.caption{margin-top:10px;color:#ff7597;font-size:16px;letter-spacing:2px}.subcaption{margin-top:9px;color:#b3a8c1;font-size:11px}
.particle{position:fixed;bottom:-30px;z-index:5;pointer-events:none;color:#ff547d;text-shadow:0 0 10px #ff1744;animation:floatUp linear forwards}
#creatorCredit{position:fixed;left:20px;bottom:24px;color:#ff8da9;font-size:13px;letter-spacing:1px;text-shadow:0 0 12px #ff174466;z-index:10}
#musicPlayer{position:fixed;bottom:20px;right:20px;z-index:10;display:flex;flex-direction:column;gap:9px;width:235px;padding:13px;background:#17121fee;border:1px solid #ff547d88;border-radius:14px;box-shadow:0 0 22px #ff174433;font-family:Consolas,monospace}
#musicToggle,#chooseSong{color:white;background:#d91e4e;border:0;border-radius:20px;padding:10px 12px;cursor:pointer;font-size:12px}
#chooseSong{background:#30243a;border:1px solid #ff547d66}
#musicStatus{color:#ff9bb4;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
#songFile{display:none}
@keyframes drawHeart{to{stroke-dashoffset:0}}@keyframes fillHeart{to{opacity:1}}@keyframes drawDecoration{to{stroke-dashoffset:0}}@keyframes blink{50%{opacity:0}}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) rotate(360deg) scale(1.3);opacity:0}}
@keyframes heartbeat{0%,100%{transform:scale(1)}20%{transform:scale(1.06)}35%{transform:scale(1)}50%{transform:scale(1.04)}}
.heart-button:hover svg{animation:heartbeat 1s infinite}
@media(max-width:700px){body{overflow-y:auto;min-height:100vh}.scene{flex-direction:column-reverse;gap:20px;padding:20px 12px;margin:20px 0 150px}.heart-area{width:240px}svg{width:210px}.window{width:min(340px,92vw)}#musicPlayer{right:50%;transform:translateX(50%);bottom:12px;width:min(320px,92vw)}#creatorCredit{left:12px;bottom:100px;font-size:11px}}
</style>
</head>
<body>
<div class="scene">
  <div class="window">
    <div class="topbar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span style="margin-left:8px">my_heart.exe</span></div>
    <div class="heading">&gt; A special message for you ❤️</div>
    <div class="message"><span class="prompt">ENG. A7MED 3LLAM:~$ </span><span id="message">Click the heart...</span><span class="cursor"></span></div>
    <div class="hint" id="counter">Click the heart to reveal a message...</div>
  </div>
  <div class="heart-area">
    <button class="heart-button" id="heart" aria-label="Show a sweet message">
      <svg viewBox="0 0 260 280" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="heartGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff8b9c"/><stop offset="50%" stop-color="#ff244b"/><stop offset="100%" stop-color="#c90035"/></linearGradient><clipPath id="heartClip"><path d="M130 225 C111 210 46 160 46 112 C46 66 101 55 130 99 C159 55 214 66 214 112 C214 160 149 210 130 225 Z"/></clipPath></defs>
        <path class="decoration" d="M130 90 C105 60 126 27 145 38 C164 49 151 72 134 79 C154 53 181 61 194 76"/>
        <path class="decoration" d="M119 83 C94 54 102 34 111 23"/>
        <path class="decoration" d="M104 92 C81 66 89 44 94 35"/>
        <path class="heart-fill" d="M130 225 C111 210 46 160 46 112 C46 66 101 55 130 99 C159 55 214 66 214 112 C214 160 149 210 130 225 Z"/><image id="heartPhoto" class="heart-photo" x="38" y="52" width="184" height="178" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)"/>
        <path class="heart-outline" d="M130 225 C111 210 46 160 46 112 C46 66 101 55 130 99 C159 55 214 66 214 112 C214 160 149 210 130 225 Z"/>
      </svg>
    </button>
    <div class="caption">FOR YOU, ALWAYS</div>
    <div class="subcaption">one heart • endless words</div>
  </div>
</div>

<div id="creatorCredit">By ENG. A7MED 3LLAM</div>

<div id="musicPlayer">
  <button id="musicToggle">▶ Play Music</button>
  <div id="musicStatus">Trying to start the music ❤️</div>
</div>
<audio id="bgMusic" src="song.mp3" autoplay loop preload="auto"></audio>

<script>
const heart = document.getElementById("heart");
const message = document.getElementById("message");
const counter = document.getElementById("counter");
const bgMusic = document.getElementById("bgMusic");
const musicToggle = document.getElementById("musicToggle");
const musicStatus = document.getElementById("musicStatus");
const heartPhoto = document.getElementById("heartPhoto");
const heartPhotoUrl = "photos/photo_02.png";
let chosenSong = true;

const messages = [
  "Enta agmal haga 7asaletly ❤️",
  "Kol mara bakalmak ba7es eny mabsoot awy 💗",
  "Enta mesh sh5s 3ady, enta 7aga m5talefa 5ales ❤️",
  "Law el donya kolaha et8ayaret, hatfdal 8aly 3andy 💖",
  "Ana momken ansa ay 7aga, bas ma ansash tafaseelak 🥹",
  "Wogoodak lwa7do by5aly el ayam a7la ❤️",
  "Enta el smile elly betegy mn 8er sabab 💕",
  "Kol yom by3ady by5aliny a3raf enak 7aga gamila awy 💘",
  "Law 3andy alf mara a5tar, ha5tark enta kol mara ❤️",
  "Enta le7ad delwa2ty a7la 7aga fe 7ayaty 💗"
];

let index = -1;
let typingTimer = null;
let clickCount = 0;

function typeMessage(text) {
  clearTimeout(typingTimer);
  message.textContent = "";
  let i = 0;
  function typeNext() {
    if (i < text.length) {
      message.textContent += text.charAt(i++);
      typingTimer = setTimeout(typeNext, 48);
    }
  }
  typeNext();
}

function makeParticles() {
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("span");
    p.className = "particle";
    p.textContent = Math.random() > 0.4 ? "❤" : "♥";
    p.style.left = Math.random() * 100 + "vw";
    p.style.fontSize = (12 + Math.random() * 20) + "px";
    p.style.animationDuration = (3 + Math.random() * 3) + "s";
    p.style.animationDelay = (Math.random() * .5) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 7000);
  }
}

function updateMusicUI() {
  musicToggle.textContent = bgMusic.paused ? "▶ Play Music" : "⏸ Pause Music";
  musicStatus.textContent = bgMusic.paused
    ? "If autoplay is blocked, press Play Music ❤️"
    : "Now playing for you ❤️";
}

async function startMusic() {
  try {
    await bgMusic.play();
    updateMusicUI();
  } catch (error) {
    musicStatus.textContent = "Browser blocked autoplay — press Play Music ❤️";
    updateMusicUI();
  }
}

musicToggle.addEventListener("click", async () => {
  if (bgMusic.paused) await startMusic();
  else {
    bgMusic.pause();
    updateMusicUI();
  }
});

heart.addEventListener("click", () => {
  index = (index + 1) % messages.length;
  clickCount++;
  typeMessage(messages[index]);
  makeParticles();
  counter.textContent = "Message " + clickCount + " • made with love ❤️";
  if (bgMusic.paused) startMusic();
});

bgMusic.addEventListener("play", updateMusicUI);
bgMusic.addEventListener("pause", updateMusicUI);

// Keep photo #2 fixed inside the heart when the page opens.
window.addEventListener("load", () => { heartPhoto.setAttribute("href", heartPhotoUrl); heartPhoto.style.opacity = "1"; startMusic(); });
</script>
</body>
</html>
